
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYY EARN</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f7f2;
      color: #171717;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      width: min(85%, 350px);
      box-shadow: 0 8px 30px #0000000d;
    }
    h1 { font-size: 32px; }
    span { color: #d49b00; }
    button {
      background: #171717;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
    }
    #status { font-size: 13px; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>HYY <span>EARN</span></h1>
    <p>Complete tasks. Earn rewards.</p>
    <button id="login">Continue with Google</button>
    <p id="status">Demo platform</p>
  </div>

  <script>
    const SUPABASE_URL = "https://hofrfwjldbrfveufuvxu.supabase.co";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    document.getElementById("login").onclick = async () => {
      document.getElementById("status").textContent = "Connecting...";
      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin
        }
      });

      if (error) {
        document.getElementById("status").textContent = error.message;
      }
    };
  </script>
</body>
</html>
