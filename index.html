<script>
const SUPABASE_URL="https://hofrfwjldbrfveufuvxu.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_cdAswmtul4dLtyXvfIrWgQ_i42neFMJ";

const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{

function showStatus(message,ok){
 status.textContent=message||"";
 status.className=ok?"ok":"";
}
function rupees(paise){return "₹"+((paise||0)/100).toFixed(2)}
function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,char=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[char]));
}

  <p class="muted">Complete · Earn · Redeem</p>
  <h3>Welcome to HYY EARN</h3>
  <p class="muted">Login with your Google account to continue.</p>
  <button class="action" id="login">Continue with Google</button>
 </div>`;
 document.getElementById("login").onclick=async()=>{
  showStatus("Connecting...");
  const {error}=await client.auth.signInWithOAuth({
   provider:"google",options:{redirectTo:window.location.origin}
  });
  if(error)showStatus(error.message);
 };

function showUsername(user){
 content.innerHTML=`
 <div class="auth-card">
  <h1>HYY <span>EARN</span></h1>
  <h3>Create your username</h3>
  <p class="muted">Choose a unique username.</p>
  <input id="username" maxlength="20" placeholder="Enter username">
  <button class="action" id="save">Save Username</button>
 </div>`;
 document.getElementById("save").onclick=async()=>{
  const username=document.getElementById("username").value.trim();
  if(!/^[a-zA-Z0-9_-]{3,20}$/.test(username)){
   showStatus("Use 3-20 letters, numbers, _ or -");return;
  }
  const btn=document.getElementById("save");
  btn.disabled=true;showStatus("Saving...");
  const {error}=await client.from("profilea").insert({id:user.id,username});
  if(error){
   btn.disabled=false;
   showStatus(error.code==="23505"?"Username already taken":error.message);return;
  }
  showStatus("");showDashboard(username,user);
 };
}

async function getBalance(user){
 const {data,error}=await client.from("wallet").select("balance_paise").eq("user_id",user.id).maybeSingle();
 if(error){showStatus("Wallet: "+error.message);return 0}
 return data?data.balance_paise:0;
}

async function loadPublishedTasks(){
 const list=document.getElementById("availableTasks");
 if(!list)return;
 list.textContent="Loading available tasks...";
 const {data:tasks,error}=await client.from("tasks")
  .select("id,title,description,category,reward_paise,task_url")
  .eq("status","published").order("created_at",{ascending:false});
 if(error){list.textContent="Unable to load tasks. Please try again.";return}
 if(!tasks||!tasks.length){
  list.innerHTML=`<div class="coming"><span>No active tasks</span><h4>New tasks coming soon!</h4><p class="muted">Please check again later.</p></div>`;return;
 }
 list.innerHTML=tasks.map(task=>{
  let link="";
  if(task.task_url){
   try{
    const url=new URL(task.task_url);
    if(["https:","http:"].includes(url.protocol)){
     link=`<a class="task-link" href="${escapeHTML(url.href)}" target="_blank" rel="noopener noreferrer">Open Task →</a>`;
    }
   }catch{}
  }
  return `<div class="task-row">
   <h4>${escapeHTML(task.title)}</h4>
   <p>${escapeHTML(task.description||"No description")}</p>
   <p>Category: ${escapeHTML(task.category)}</p>
   <p>Listed reward: ${rupees(task.reward_paise)}</p>${link}
  </div>`;
 }).join("");
}

function closeWithdrawModal(){document.getElementById("withdrawModal")?.classList.add("hidden")}
function openAdminPassword(){document.getElementById("adminPasswordModal")?.classList.remove("hidden");showStatus("")}

async function checkAdminPermission(){
 const {data,error}=await client.rpc("is_admin");
 if(error){console.error("Admin check:",error.message);return false}
 return data===true;
}

   btn.onclick=()=>editTask(btn.dataset.edit,data.find(t=>String(t.id)===btn.dataset.edit));
  });
  list.querySelectorAll("[data-toggle]").forEach(btn=>{
   btn.onclick=()=>toggleTask(btn.dataset.toggle,btn.dataset.status);
  });
  list.querySelectorAll("[data-delete]").forEach(btn=>{
   btn.onclick=()=>deleteTask(btn.dataset.delete);
  });
 }

 async function toggleTask(id,currentStatus){
  if(!adminVerified)return;
  const newStatus=currentStatus==="paused"?"published":"paused";
  const label=newStatus==="paused"?"pause":"resume";
  if(!confirm("Are you sure you want to "+label+" this task?"))return;
  const {error}=await client.from("tasks").update({status:newStatus}).eq("id",id);
  if(error){showStatus("Update failed: "+error.message);return}
  showStatus(newStatus==="paused"?"Task paused.":"Task resumed.",true);
  loadAdminTasks();
 }

 async function deleteTask(id){
  if(!adminVerified)return;
  if(!confirm("Permanently delete this task? This cannot be undone."))return;
  const {error}=await client.from("tasks").delete().eq("id",id);
  if(error){showStatus("Delete failed: "+error.message);return}
  showStatus("Task deleted successfully.",true);
  loadAdminTasks();
 }

 function editTask(id,task){
  if(!adminVerified||!task)return;
  content.innerHTML=`
   <header class="header"><div class="brand"><div class="logo">✦</div><div><h2>HYY EARN</h2><p>Edit Task</p></div></div></header>
   <button class="back-btn" id="backAdmin">← Admin Dashboard</button>
   <section class="admin-head"><h2>✏️ Edit Task</h2><p style="margin:0;opacity:.85;font-size:13px">Update task details.</p></section>
   <section class="admin-item">
    <input id="editTitle" maxlength="100" placeholder="Task title" value="${escapeHTML(task.title)}">
    <textarea id="editDescription" maxlength="1000" placeholder="Task description">${escapeHTML(task.description||"")}</textarea>
    <input id="editCategory" maxlength="40" placeholder="Category" value="${escapeHTML(task.category||"General")}">
    <input id="editReward" type="number" min="0" max="100000" step="0.01" placeholder="Reward amount (₹)" value="${(task.reward_paise||0)/100}">
    <input id="editUrl" type="url" placeholder="Task link (optional)" value="${escapeHTML(task.task_url||"")}">
    <button class="action" id="saveEdit">Save Changes</button>
   </section>`;

  document.getElementById("backAdmin").onclick=showAdminDashboard;
  document.getElementById("saveEdit").onclick=async()=>{
   const title=document.getElementById("editTitle").value.trim();
   const description=document.getElementById("editDescription").value.trim();
   const category=document.getElementById("editCategory").value.trim()||"General";
   const reward=Number(document.getElementById("editReward").value);
   const taskUrl=document.getElementById("editUrl").value.trim();
   if(!title){showStatus("Task title enter cheyyi.");return}
   if(!Number.isFinite(reward)||reward<0||reward>100000){showStatus("Valid reward amount enter cheyyi.");return}
   if(taskUrl){
    try{const u=new URL(taskUrl);if(!["https:","http:"].includes(u.protocol))throw new Error()}
    catch{showStatus("Valid task link enter cheyyi.");return}
   }
   const btn=document.getElementById("saveEdit");btn.disabled=true;showStatus("Updating...");
   const {error}=await client.from("tasks").update({
    title,description,category,reward_paise:Math.round(reward*100),task_url:taskUrl||null
   }).eq("id",id);
   btn.disabled=false;
   if(error){showStatus("Edit failed: "+error.message);return}
   showStatus("Task updated successfully!",true);
   showAdminDashboard();
  };
 }

 function renderCreateTaskPage(){
  if(!adminVerified||!currentUser)return;
  content.innerHTML=`
   <header class="header"><div class="brand"><div class="logo">✦</div><div><h2>HYY EARN</h2><p>Create New Task</p></div></div></header>
   <button class="back-btn" id="backAdmin">← Admin Dashboard</button>
   <section class="admin-head"><h2>➕ Create Tasks</h2><p style="margin:0;opacity:.85;font-size:13px">Add a new task for users.</p></section>
   <section class="admin-item"><h3>Task Details</h3>
    <input id="taskTitle" maxlength="100" placeholder="Task title">
    <textarea id="taskDescription" maxlength="1000" placeholder="Task description"></textarea>
    <input id="taskCategory" maxlength="40" placeholder="Category (e.g. Survey)">
    <input id="taskReward" type="number" min="0" max="100000" step="0.01" placeholder="Reward amount (₹)">
    <input id="taskUrl" type="url" placeholder="Task link (optional)">
    <button class="action" id="publishTask">Publish Task</button>
    <button class="action" id="saveDraft" style="background:#eee3f8;color:#7138c8">Save as Draft</button>
   </section>`;

  document.getElementById("backAdmin").onclick=showAdminDashboard;
  async function createTask(taskStatus){
   const title=document.getElementById("taskTitle").value.trim();
   const description=document.getElementById("taskDescription").value.trim();
   const category=document.getElementById("taskCategory").value.trim()||"General";
   const reward=Number(document.getElementById("taskReward").value);
   const taskUrl=document.getElementById("taskUrl").value.trim();
   if(!title){showStatus("Task title enter cheyyi.");return}
   if(!Number.isFinite(reward)||reward<0||reward>100000){showStatus("Valid reward amount enter cheyyi.");return}
   if(taskUrl){
    try{const u=new URL(taskUrl);if(!["https:","http:"].includes(u.protocol))throw new Error()}
    catch{showStatus("Valid task link enter cheyyi.");return}
   }
   const btn=document.getElementById(taskStatus==="published"?"publishTask":"saveDraft");
   btn.disabled=true;showStatus("Saving task...");
   const {error}=await client.from("tasks").insert({
    title,description,category,reward_paise:Math.round(reward*100),
    task_url:taskUrl||null,status:taskStatus
   });
   btn.disabled=false;
   if(error){showStatus("Task save failed: "+error.message);return}
   showStatus(taskStatus==="published"?"Task published successfully!":"Task saved as draft!",true);
   renderCreateTaskPage();
  }
  document.getElementById("publishTask").onclick=()=>createTask("published");
  document.getElementById("saveDraft").onclick=()=>createTask("draft");
 }

 loadAdminTasks();
}

async function loadUser(user){
 currentUser=user;showStatus("Loading profile...");
 const {data:profile,error}=await client.from("profilea").select("username").eq("id",user.id).maybeSingle();
 if(error){showStatus(error.message);return}
 showStatus("");
 if(profile)await showDashboard(profile.username,user);
 else showUsername(user);
}

async function checkLogin(){
 const {data,error}=await client.auth.getSession();
 if(error){showStatus(error.message);showLogin();return}
 const user=data.session?.user;
 if(!user){showLogin();return}
 await loadUser(user);
}

client.auth.onAuthStateChange((event,session)=>{
 if(event==="INITIAL_SESSION")return;
 if(session?.user&&event==="SIGNED_IN")setTimeout(()=>loadUser(session.user),0);
 else if(event==="SIGNED_OUT"){adminVerified=false;showLogin()}
});

async function start(){
 const code=new URLSearchParams(location.search).get("code");
 if(code){
  showStatus("Finishing login...");
  const {error}=await client.auth.exchangeCodeForSession(code);
  history.replaceState({},"",location.pathname);
  if(error)showStatus("Exchange error: "+error.message);
 }
 await checkLogin();
}
start();
</script>
