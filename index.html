<script>
const SUPABASE_URL = "https://hofrfwjldbrfveufuvxu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cdAswmtul4dLtyXvflrWgQ_i42neFMJ";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const card = document.querySelector(".card");
const status = document.getElementById("status");
const login = document.getElementById("login");

function showUsernameForm(user) {
  card.innerHTML = `
    <h1>HYY <span>EARN</span></h1>
    <p>Welcome! Create your username.</p>
    <input id="username" placeholder="Enter username"
      style="padding:14px;width:85%;margin-bottom:15px">
    <button id="save">Save Username</button>
    <p id="status"></p>
  `;

  document.getElementById("save").onclick = async () => {
    const username = document.getElementById("username").value.trim();
    const msg = document.getElementById("status");

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
      msg.textContent = "Use 3-20 letters, numbers or _";
      return;
    }

    msg.textContent = "Saving...";

    const { error } = await client
      .from("profiles")
      .insert({ id: user.id, username });

    if (error) {
      msg.textContent = error.code === "23505"
        ? "Username already taken!"
        : error.message;
      return;
    }

    showDashboard(username);
  };
}

function showDashboard(username) {
  card.innerHTML = `
    <h1>HYY <span>EARN</span></h1>
    <h2>Welcome, ${username}!</h2>
    <p>Account created successfully.</p>
    <p>Demo platform</p>
    <button id="logout">Logout</button>
  `;

  document.getElementById("logout").onclick = async () => {
    await client.auth.signOut();
    location.reload();
  };
}

async function checkLogin() {
  const { data } = await client.auth.getSession();
  const user = data.session?.user;

  if (!user) return;

  const { data: profile, error } = await client
    .from("profilea")
    .select("username")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    status.textContent = error.message;
    return;
  }

  if (profile) {
    showDashboard(profile.username);
  } else {
    showUsernameForm(user);
  }
}

login.onclick = async () => {
  status.textContent = "Connecting...";

  const { error } = await client.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin }
  });

  if (error) status.textContent = error.message;
};

checkLogin();
</script>
