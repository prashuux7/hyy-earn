
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYY EARN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7f3;font-family:Arial,sans-serif;padding:30px 15px;text-align:center}
.card{max-width:450px;margin:50px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{font-size:34px;margin-bottom:25px}
h1 span{color:#d5a500}
input,button{width:100%;padding:15px;margin:10px 0;border-radius:10px;font-size:16px}
input{border:1px solid #ddd}
button{background:#171717;color:white;border:0;cursor:pointer}
button.alt{background:#d5a500;color:#171717}
button.link{background:none;color:#777;font-size:14px;padding:8px}
button:disabled{opacity:.5}
#status{color:#c0392b;font-size:14px;overflow-wrap:anywhere}
#status.ok{color:#2e8b57}
.muted{color:#777;font-size:14px}
.balance{background:#f8f7f3;border-radius:14px;padding:16px;margin:14px 0}
.balance b{display:block;font-size:34px;color:#171717}
.box{border-top:1px solid #eee;margin-top:18px;padding-top:6px}

/* Available Tasks */
.tasks{border-top:1px solid #eee;margin-top:20px;padding-top:15px;text-align:left}
.task-empty{background:#f8f7f3;border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.task-empty p{margin:6px 0}
.task-label{display:inline-block;background:#fff1bd;color:#806000;padding:6px 10px;border-radius:20px;font-size:12px}
</style>
</head>

<body>

<div class="card">
 <h1>HYY <span>EARN</span></h1>
 <div id="content">Loading...</div>
 <p id="status"></p>
</div>

<script>
const SUPABASE_URL = "https://hofrfwjldbrfveufuvxu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cdAswmtul4dLtyXvfIrWgQ_i42neFMJ";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
 auth:{
  flowType:"pkce",
  persistSession:true,
  autoRefreshToken:true,
  detectSessionInUrl:false
 }
});

const content = document.getElementById("content");
const status = document.getElementById("status");

function showStatus(message, ok){
 status.textContent = message || "";
 status.className = ok ? "ok" : "";
}

function rupees(paise){
 return "₹" + ((paise || 0) / 100).toFixed(2);
}

const urlParams = new URLSearchParams(
 location.hash.slice(1) + "&" + location.search.slice(1)
);
if(urlParams.get("error_description")){
 showStatus(urlParams.get("error_description"));
}

function showLogin(){
 content.innerHTML = `
  <h3>Welcome to HYY EARN</h3>
  <p class="muted">Login with your Google account</p>
  <button id="login">Continue with Google</button>
 `;

 document.getElementById("login").onclick = async()=>{
  showStatus("Connecting...");
  const {error} = await client.auth.signInWithOAuth({
   provider:"google",
   options:{ redirectTo:window.location.origin }
  });
  if(error) showStatus(error.message);
 };
}

function showUsername(user){
 content.innerHTML = `
  <h3>Create your username</h3>
  <p class="muted">Choose a unique username</p>
  <input id="username" maxlength="20" placeholder="Enter username">
  <button id="save">Save Username</button>
 `;

 document.getElementById("save").onclick = async()=>{
  const username = document.getElementById("username").value.trim();

  if(!/^[a-zA-Z0-9_-]{3,20}$/.test(username)){
   showStatus("Use 3-20 letters, numbers, _ or -");
   return;
  }

  const saveButton = document.getElementById("save");
  saveButton.disabled = true;
  showStatus("Saving...");

  const {error} = await client
   .from("profilea")
   .insert({ id:user.id, username:username });

  if(error){
   saveButton.disabled = false;
   showStatus(
    error.code === "23505" ? "Username already taken" : error.message
   );
   return;
  }

  showStatus("");
  showDashboard(username, user);
 };
}

async function getBalance(user){
 const {data} = await client
  .from("wallet")
  .select("balance_paise")
  .eq("user_id", user.id)
  .maybeSingle();
 return data ? data.balance_paise : 0;
}

async function showDashboard(username, user){
 content.innerHTML = `
  <h2 id="welcome"></h2>

  <div class="balance">
   <span class="muted">Demo balance</span>
   <b id="bal">...</b>
  </div>

  <button id="checkin" class="alt">Daily Check-in (+₹1)</button>

  <!-- Available Tasks Section -->
  <div class="tasks">
   <h3>Available Tasks</h3>
   <p class="muted">Complete tasks and earn rewards.</p>

   <div class="task-empty">
    <span class="task-label">Coming Soon</span>
    <h4>No active tasks yet</h4>
    <p class="muted">
     New sponsored tasks will appear here after approval.
    </p>
   </div>
  </div>

  <div class="box">
   <h3>Withdraw request</h3>
   <p class="muted">Minimum ₹100. Demo stage lo idi request matrame.</p>
   <input id="wamount" type="number" min="100" placeholder="Amount (₹)">
   <input id="wupi" placeholder="UPI ID (name@bank)">
   <button id="withdraw">Send Request</button>
  </div>

  <p class="muted">HYY EARN Demo Platform</p>
  <button id="logout" class="link">Logout</button>
 `;

 document.getElementById("welcome").textContent = "Welcome, " + username + "!";

 const bal = document.getElementById("bal");
 bal.textContent = rupees(await getBalance(user));

 document.getElementById("checkin").onclick = async()=>{
  const btn = document.getElementById("checkin");
  btn.disabled = true;
  showStatus("Checking in...");
  const {data,error} = await client.rpc("daily_checkin");
  btn.disabled = false;
  if(error){
   showStatus(error.message.includes("Already")
    ? "Ee roju check-in ayyindi. Repu malli randi!"
    : error.message);
   return;
  }
  bal.textContent = rupees(data);
  showStatus("Check-in successful!", true);
 };

 document.getElementById("withdraw").onclick = async()=>{
  const amount = Math.round(Number(document.getElementById("wamount").value) * 100);
  const upi = document.getElementById("wupi").value.trim();

  if(!amount || amount < 10000){
   showStatus("Minimum withdrawal ₹100");
   return;
  }
  if(!/^[\w.\-]{2,}@[\w]{2,}$/.test(upi)){
   showStatus("Sariyaina UPI ID ivvandi (name@bank)");
   return;
  }

  const btn = document.getElementById("withdraw");
  btn.disabled = true;
  showStatus("Sending...");
  const {error} = await client.rpc("request_withdrawal",{
   p_amount: amount,
   p_upi: upi
  });
  btn.disabled = false;

  if(error){
   showStatus(error.message);
   return;
  }

  bal.textContent = rupees(await getBalance(user));
  showStatus("Request sent!", true);
 };

 document.getElementById("logout").onclick = async()=>{
  showStatus("Logging out...");
  const {error} = await client.auth.signOut();
  if(error){
   showStatus(error.message);
   return;
  }
  showLogin();
  showStatus("");
 };
}

async function loadUser(user){
 showStatus("Loading profile...");

 const {data:profile,error} = await client
  .from("profilea")
  .select("username")
  .eq("id",user.id)
  .maybeSingle();

 if(error){
  showStatus(error.message);
  return;
 }

 showStatus("");

 if(profile){
  showDashboard(profile.username, user);
 }else{
  showUsername(user);
 }
}

async function checkLogin(){
 const {data,error} = await client.auth.getSession();

 if(error){
  showStatus(error.message);
  showLogin();
  return;
 }

 const user = data.session?.user;

 if(!user){
  showLogin();
  return;
 }

 await loadUser(user);
}

client.auth.onAuthStateChange((event,session)=>{
 if(event === "INITIAL_SESSION") return;

 if(session?.user && event === "SIGNED_IN"){
  setTimeout(()=>{ loadUser(session.user); },0);
 }else if(event === "SIGNED_OUT"){
  showLogin();
 }
});

async function start(){
 const code = new URLSearchParams(location.search).get("code");
 if(code){
  showStatus("Finishing login...");
  const {error} = await client.auth.exchangeCodeForSession(code);
  history.replaceState({}, "", location.pathname);
  if(error) showStatus("Exchange error: " + error.message);
 }
 checkLogin();
}

start();
</script>

</body>
</html>
