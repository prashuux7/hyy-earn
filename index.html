<script>
const SUPABASE_URL = "https://hofrfwjldbrfveufuvxu.supabase.co";
const SUPABASE_KEY = "sb_publishable_cdAswmtul4dLtyXvfIrWgQ_i42neFMJ";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    flowType:"pkce",
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});

// Save referral code before Google login / redirect.
const incomingReferral=new URLSearchParams(window.location.search).get("ref");
if(incomingReferral){
  localStorage.setItem("hyy_pending_referral",incomingReferral.trim());
  window.history.replaceState({},document.title,window.location.pathname);
}

let currentUser=null;
let username="";
let walletBalance=0;
let isAdmin=false;
let adminVerified=false;
let currentPage="home";
let cachedTasks=[];
let cachedApps=[];
let cachedSubmissions=[];
let cachedWithdrawals=[];
let myReferralCode="";
let referralStats={total_referrals:0,completed:0,pending:0,total_earned_paise:0};
let activeBannerAds=[];
let activeBannerIndex=0;
let adRotationTimer=null;

const app=document.getElementById("app");
const modalRoot=document.getElementById("modalRoot");

function money(paise){
  return "₹"+(Number(paise||0)/100).toFixed(2);
}
function safe(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function svgIcon(name){
  const paths={
    heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>',
    menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
    clipboard:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 10h6M9 14h6M9 18h3"/>',
    gift:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M2 6h20v3H2zM12 6H8.5a2.5 2.5 0 1 1 2.5-2.5V6Zm0 0h3.5A2.5 2.5 0 1 0 13 3.5V6Z"/>',
    users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7-7.8a4 4 0 0 1 0 7.6M20 21v-2a4 4 0 0 0-3-3.9"/>',
    wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    hand:'<path d="M8 12V5a2 2 0 0 1 4 0v6-2a2 2 0 0 1 4 0v3-1a2 2 0 0 1 4 0v5a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-3l-3-4a2 2 0 0 1 3-3l1 1Z"/>',
    gamepad:'<path d="M6 11h4m-2-2v4m8-3h.01M18 12h.01M7 7h10a4 4 0 0 1 3.9 3.1l1 5A3 3 0 0 1 17 18l-3-3h-4l-3 3a3 3 0 0 1-4.9-2.9l1-5A4 4 0 0 1 7 7Z"/>',
    file:'<path d="M6 3h8l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/>',
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
    shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>',
    fileText:'<path d="M6 3h8l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1-1.9 1.3-1.9 2.8M12 17h.01"/>'
  };
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.file}</svg>`;
}
function initIcons(){
  const brand=document.getElementById("brandIcon");
  const menu=document.getElementById("menuIcon");
  if(brand)brand.innerHTML=svgIcon("heart");
  if(menu)menu.innerHTML=svgIcon("menu");
  document.querySelectorAll(".nav-icon").forEach(el=>el.innerHTML=svgIcon(el.dataset.icon));
}
function showMessage(message){alert(message);}
function toggleMenu(){
  document.getElementById("profileMenu").classList.toggle("hidden");
}
function closeMenu(){
  document.getElementById("profileMenu").classList.add("hidden");
}
function setPage(html){app.innerHTML=html;}
function updateNav(){
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===currentPage);
  });
}
async function getWallet(){
  const {data,error}=await db.from("wallet")
    .select("balance_paise")
    .eq("user_id",currentUser.id)
    .maybeSingle();
  if(error) console.error(error);
  walletBalance=data?.balance_paise||0;
}
async function getUsername(){
  const {data,error}=await db.from("profilea")
    .select("username")
    .eq("id",currentUser.id)
    .maybeSingle();
  if(error) console.error(error);
  username=data?.username||"User";
  document.getElementById("menuUsername").textContent=username;
}
async function checkAdmin(){
  const {data,error}=await db.rpc("is_admin");
  isAdmin=!error && (data===true || data?.is_admin===true);
  document.getElementById("adminMenuBtn").classList.toggle("hidden",!isAdmin);
}
async function refreshAccount(){
  await Promise.all([getWallet(),getUsername(),checkAdmin()]);
}

// Link the referral after the invited person has logged in.
async function processPendingReferral(){
  const code=localStorage.getItem("hyy_pending_referral");
  if(!code||!currentUser)return;

  const {data,error}=await db.rpc("register_referral",{p_code:code});
  if(error){
    console.error("Referral registration error:",error);
    return;
  }
  localStorage.removeItem("hyy_pending_referral");
  if(data===true){
    console.log("Referral successfully linked.");
  }else{
    console.log("Referral code invalid, already used, or self-referral.");
  }
}

async function startApp(){
  initIcons();
  const {data:{session}}=await db.auth.getSession();
  initIcons();
  if(!session){showLogin();return;}
  currentUser=session.user;
  await refreshAccount();
  await processPendingReferral();
  document.getElementById("bottomNav").classList.remove("hidden");
  openPage("home");
}
function showLogin(){
  document.getElementById("bottomNav").classList.add("hidden");
  document.getElementById("profileMenu").classList.add("hidden");
  setPage(`
    <div class="card center">
      <h1>${svgIcon("heart")} HYY EARN</h1>
      <p>Welcome! Login to continue.</p>
      <button class="btn" onclick="googleLogin()">Continue with Google</button>
      <p class="muted">heyy earn platform</p>
    </div>
  `);
}
async function googleLogin(){
  const {error}=await db.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:window.location.origin}
  });
  if(error)showMessage(error.message);
}
async function logout(){
  closeMenu();
  await db.auth.signOut();
  currentUser=null;
  showLogin();
}
async function openPage(page){
  if(!currentUser){showLogin();return;}
  currentPage=page;
  updateNav();
  closeMenu();
  document.getElementById("bottomNav").classList.remove("hidden");

  if(page==="home")return renderHome();
  if(page==="task")return renderTasks();
  if(page==="refer")return renderReferPage();
  if(page==="community")return renderCommunity();
  if(page==="wallet")return renderWallet();
  if(page==="profile")return renderProfile();
  if(page==="surveys")return renderSurveysPage();
  if(page==="rewards")return renderRewardsPage();
  if(page==="sponsor")return renderSponsorRequestPage();
}

async function renderHome(){
  if(adRotationTimer){clearInterval(adRotationTimer);adRotationTimer=null;}
  await getWallet();
  const [{data:homeTasks,error:homeTaskError},{data:homeApps,error:homeAppError},{data:bannerAds},{data:cardAds}]=await Promise.all([
    db.from("tasks").select("*").eq("status","published").order("created_at",{ascending:false}).limit(5),
    db.from("sponsored_apps").select("id,app_name,description,icon_path,install_url").eq("status","published").order("created_at",{ascending:false}),
    db.from("ads").select("*").eq("status","published").eq("placement","banner").order("created_at",{ascending:false}),
    db.from("ads").select("*").eq("status","published").eq("placement","card").order("created_at",{ascending:false})
  ]);
  cachedTasks=homeTasks||[];
  cachedApps=homeApps||[];
  activeBannerAds=(bannerAds||[]).filter(a=>(!a.start_at||new Date(a.start_at)<=new Date())&&(!a.end_at||new Date(a.end_at)>new Date()));
  const visibleCardAds=(cardAds||[]).filter(a=>(!a.start_at||new Date(a.start_at)<=new Date())&&(!a.end_at||new Date(a.end_at)>new Date()));
  window.hyyVisibleAds=[...(bannerAds||[]),...visibleCardAds];
  activeBannerIndex=0;
  let latestTasksHtml="";
  if(homeTaskError||homeAppError){
    latestTasksHtml=`<div class="card muted">Tasks could not be loaded right now.</div>`;
  }else if(!cachedTasks.length){
    latestTasksHtml=`<div class="card center">New tasks coming soon!</div>`;
  }else{
    for(const task of cachedTasks){
      const linkedApp=task.app_id?cachedApps.find(a=>String(a.id)===String(task.app_id)):null;
      const action=linkedApp?`openSponsoredApp('${safe(linkedApp.id)}')`:`openTask('${safe(task.id)}')`;
      const iconUrl=linkedApp?.icon_path?db.storage.from("app-icons").getPublicUrl(linkedApp.icon_path).data.publicUrl:"";
      const iconHtml=iconUrl?`<img class="featured-icon" src="${safe(iconUrl)}" alt="">`:`<div class="featured-icon">${linkedApp?"📱":"✨"}</div>`;
      latestTasksHtml+=`<div class="card featured-task" role="button" tabindex="0" onclick="${action}">${iconHtml}<div class="featured-info"><h4>${safe(task.title)}</h4><p class="muted">${safe(task.description|| (linkedApp?linkedApp.app_name:"Complete this task and submit proof."))}</p></div><span class="featured-reward">${money(task.reward_paise)}</span></div>`;
    }
  }
  const bannerHtml=activeBannerAds.length?`<div id="adBanner" class="ad-banner" onclick="openAd('${safe(activeBannerAds[0].id)}')" role="button" tabindex="0"></div><div id="adDots" class="ad-dots"></div>`:`<div class="card center muted">Sponsored banners will appear here.</div>`;
  const sponsoredHtml=visibleCardAds.length?visibleCardAds.map(a=>`<div class="card sponsored-card"><div class="sponsored-label">SPONSORED</div>${a.image_url?`<img src="${safe(a.image_url)}" alt="" style="width:100%;max-height:130px;object-fit:cover;border-radius:12px;margin:8px 0">`:""}<h3>${safe(a.title)}</h3><p class="muted">${safe(a.description||"")}</p><button class="btn" onclick="openAd('${safe(a.id)}')">View Offer</button></div>`).join(""):`<p class="muted">No sponsored offers right now.</p>`;
  setPage(`
    ${bannerHtml}
    <div class="card hero">
      <p>Welcome back ${svgIcon("hand")}</p><h2>${safe(username)}</h2><p>Your wallet balance</p>
      <div class="big">${money(walletBalance)}</div><button class="btn light" onclick="openPage('wallet')">View Wallet</button>
    </div>
    <div class="card"><div class="row"><h3>Daily Check-in ${svgIcon("gift")}</h3><span class="pill">Daily</span></div><p class="muted">Check in and see whether today's reward is available.</p><button class="btn" onclick="dailyCheckin()">Daily Check-in</button></div>
    <h3>Earn More</h3><div class="grid">
      <div class="tile" onclick="openPage('task')">${svgIcon("clipboard")}<br>Tasks</div>
      <div class="tile" onclick="openPage('surveys')">${svgIcon("file")}<br>Surveys</div>
      <div class="tile" onclick="comingSoon()">${svgIcon("gamepad")}<br>Games</div>
      <div class="tile" onclick="openPage('rewards')">${svgIcon("gift")}<br>Rewards</div>
    </div>
    <h3>Sponsored Offers</h3>${sponsoredHtml}
    <div class="row"><h3>Featured Tasks 🔥</h3><button class="btn light" onclick="openPage('task')">View All ›</button></div>${latestTasksHtml}
    <div class="card"><h3>Refer & Earn ${svgIcon("heart")}</h3><p class="muted">Invite friends. Earn ₹10 when their first task is approved.</p><button class="btn" onclick="openPage('refer')">Invite Friends</button></div>
    <div class="card"><h3>Partner with HYY EARN</h3><p class="muted">Submit a sponsor request for review.</p><button class="btn light" onclick="openPage('sponsor')">Become a Sponsor</button></div>
  `);
  if(activeBannerAds.length){renderActiveBanner();if(activeBannerAds.length>1)adRotationTimer=setInterval(()=>{activeBannerIndex=(activeBannerIndex+1)%activeBannerAds.length;renderActiveBanner();},5000);}
  visibleCardAds.forEach(ad=>db.rpc("track_ad_event",{p_ad_id:ad.id,p_event_type:"impression"}).then(({error})=>{if(error)console.warn("Ad impression:",error.message);}));
}
function renderActiveBanner(){
  const ad=activeBannerAds[activeBannerIndex];const box=document.getElementById("adBanner");const dots=document.getElementById("adDots");if(!ad||!box)return;
  box.onclick=()=>openAd(ad.id);
  box.innerHTML=`${ad.image_url?`<img src="${safe(ad.image_url)}" alt="">`:""}<div class="ad-copy"><span class="ad-tag">SPONSORED</span><h3>${safe(ad.title)}</h3><p>${safe(ad.description||"")}</p><b>Tap to view →</b></div>`;
  if(dots)dots.innerHTML=activeBannerAds.map((_,i)=>`<span class="ad-dot ${i===activeBannerIndex?"active":""}"></span>`).join("");
  db.rpc("track_ad_event",{p_ad_id:ad.id,p_event_type:"impression"}).then(({error})=>{if(error)console.warn("Ad impression:",error.message);});
}
function openAd(adId){
  const ad=[...activeBannerAds].concat([]).find(a=>String(a.id)===String(adId));
  const fallback=document.querySelector(`.sponsored-card button[onclick*="${adId}"]`);
  const allAds=window.hyyVisibleAds||[];
  const item=ad||allAds.find(a=>String(a.id)===String(adId));
  if(!item){showMessage("This offer is not available.");return;}
  if(item.target_url){window.open(item.target_url,"_blank","noopener,noreferrer");}
  db.rpc("track_ad_event",{p_ad_id:item.id,p_event_type:"click"}).then(({error})=>{if(error)console.warn("Ad click:",error.message);});
}

async function dailyCheckin(){
  const {data,error}=await db.rpc("daily_checkin");
  if(error){showMessage(error.message);return;}
  showMessage(typeof data==="string"?data:"Check-in response received!");
  await getWallet();
  renderHome();
}
function comingSoon(){showMessage("Coming Soon!");}

async function renderTasks(){
  setPage(`<h2>Available Tasks ${svgIcon("clipboard")}</h2><p class="muted">Loading tasks and apps...</p>`);
  const [{data:tasks,error:taskError},{data:apps,error:appError}]=await Promise.all([
    db.from("tasks").select("*").eq("status","published").order("created_at",{ascending:false}),
    db.from("sponsored_apps").select("id,app_name,description,icon_path,install_url").eq("status","published").order("created_at",{ascending:false})
  ]);

async function openSponsoredApp(appId){
  const a=cachedApps.find(x=>String(x.id)===String(appId)); if(!a)return;
  const {data:tasks,error}=await db.from("tasks").select("*").eq("app_id",appId).eq("status","published").order("created_at",{ascending:false});
  if(error){showMessage(error.message);return;}
  cachedTasks=(cachedTasks||[]).filter(t=>String(t.app_id)!==String(appId)).concat(tasks||[]);
  const iconUrl=a.icon_path?db.storage.from("app-icons").getPublicUrl(a.icon_path).data.publicUrl:"";
  let html=`<button class="btn light" onclick="renderTasks()">← Back to Tasks</button><div class="card">${iconUrl?`<img class="app-icon" src="${safe(iconUrl)}" alt="App icon">`:`<div class="app-icon" style="display:grid;place-items:center">📱</div>`}<h2>${safe(a.app_name)}</h2><p>${safe(a.description||"")}</p>${a.install_url?`<a class="btn" href="${safe(a.install_url)}" target="_blank" rel="noopener">Open official app page ↗</a>`:""}</div><h3>Tasks for ${safe(a.app_name)}</h3>`;
  if(!tasks?.length)html+=`<div class="card center">No tasks available for this app yet.</div>`;
  for(const t of tasks||[]){
    const {data:sub}=await db.from("task_submissions").select("status").eq("task_id",t.id).eq("user_id",currentUser.id).maybeSingle();
    html+=`<div class="card task"><div class="row"><span class="pill">App Task</span><b>${money(t.reward_paise)}</b></div><h3>${safe(t.title)}</h3><p>${safe(t.description||"")}</p>${t.task_url?`<a href="${safe(t.task_url)}" target="_blank" rel="noopener">Open task instructions ↗</a><br>`:""}${sub?`<p class="status ${safe(sub.status)}">Your submission: ${safe(sub.status)}</p>`:`<button class="btn" onclick="openProof('${safe(t.id)}')">Complete & Submit Proof</button>`}</div>`;

function openProof(taskId){
  modalRoot.innerHTML=`
    <div class="modal"><div class="modalbox">
      <h3>Submit Task Proof</h3>
      <label>Proof description</label>
      <textarea id="proofText" placeholder="Describe what you completed"></textarea>
      <label>Proof link (optional)</label>
      <input id="proofUrl" placeholder="https://...">
      <label>Screenshot (optional, JPG/PNG/WebP, max 5 MB)</label>
      <input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp">
      <button class="btn" onclick="submitProof('${safe(taskId)}')">Submit Proof</button>
      <button class="btn light" onclick="closeModal()">Cancel</button>
    </div></div>`;

function closeModal(){modalRoot.innerHTML="";}
async function submitProof(taskId){
  const proofText=document.getElementById("proofText").value.trim();
  const proofUrl=document.getElementById("proofUrl").value.trim();
  const file=document.getElementById("proofFile").files[0];
  if(!proofText&&!proofUrl&&!file){
    showMessage("Please add proof text, a link, or a screenshot.");return;
  }
  if(proofUrl&&!/^https?:\/\//i.test(proofUrl)){
    showMessage("Proof link must start with http:// or https://");return;
  }
  let proofPath=null;
  if(file){
    if(file.size>5*1024*1024){showMessage("File must be under 5 MB.");return;}
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
      showMessage("Only JPG, PNG, or WebP images are allowed.");return;
    }
    const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
    proofPath=`${currentUser.id}/${crypto.randomUUID()}.${ext}`;
    const {error:uploadError}=await db.storage.from("proofs").upload(proofPath,file);
    if(uploadError){showMessage(uploadError.message);return;}
  }
  const {error}=await db.rpc("submit_task",{
    p_task_id:taskId,
    p_proof_text:proofText||null,
    p_proof_url:proofUrl||null,
    p_proof_path:proofPath
  });
  if(error){showMessage(error.message);return;}
  closeModal();
  showMessage("Proof submitted for review!");
  openTask(taskId);
}

async function openSurvey(surveyId){

    <label>Task Instructions</label><textarea id="appPromoTaskDescription" placeholder="Explain exactly what the user must complete"></textarea>
    <label>Reward Amount (₹)</label><input id="appPromoTaskReward" type="number" min="1" step="1" placeholder="Enter reward amount">
    <label>Task Link (optional)</label><input id="appPromoTaskLink" type="url" placeholder="https://...">
    <button class="btn" onclick="saveAppPromotionTask('${safe(app.id)}','published')">Publish Task</button>
    <button class="btn light" onclick="saveAppPromotionTask('${safe(app.id)}','draft')">Save as Draft</button>
    <button class="btn light" onclick="renderManageApps()">Back to App Promotions</button>
  </div>`);
}
async function saveAppPromotionTask(appId,status){
  if(!requireAdmin())return;
  const title=document.getElementById("appPromoTaskTitle").value.trim();
  const description=document.getElementById("appPromoTaskDescription").value.trim();
  const reward=Number(document.getElementById("appPromoTaskReward").value);
  const taskUrl=document.getElementById("appPromoTaskLink").value.trim();
  if(!title||!description||!Number.isFinite(reward)||reward<=0){
    showMessage("Enter task title, instructions and a valid reward amount.");return;
  }
  if(taskUrl&&!/^https:\/\//i.test(taskUrl)){
    showMessage("Task link must start with https://");return;
  }
  const {error}=await db.from("tasks").insert({
    title,description,category:"App",reward_paise:Math.round(reward*100),
    task_url:taskUrl||null,status,app_id:appId
  });
  if(error){showMessage(error.message);return;}
  showMessage(status==="published"?"App task published with reward!":"App task saved as draft!");
  renderManageApps();
}
async function saveSponsoredApp(){
  if(!requireAdmin())return;
  const name=document.getElementById("sponsorAppName").value.trim();
  const description=document.getElementById("sponsorAppDescription").value.trim();
  const url=document.getElementById("sponsorAppUrl").value.trim();
  const file=document.getElementById("sponsorAppIcon").files[0];
  if(!name||!description||!file){showMessage("Enter app name, description and choose an icon.");return;}
  if(url&&!/^https:\/\//i.test(url)){showMessage("Use a secure https:// app page link.");return;}
  if(file.size>2*1024*1024||!["image/jpeg","image/png","image/webp"].includes(file.type)){showMessage("Choose JPG, PNG or WebP under 2 MB.");return;}
  const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
  const path=`${currentUser.id}/${crypto.randomUUID()}.${ext}`;
  const {error:upErr}=await db.storage.from("app-icons").upload(path,file,{contentType:file.type,upsert:false});
  if(upErr){showMessage(upErr.message);return;}
  const {error}=await db.from("sponsored_apps").insert({app_name:name,description,install_url:url||null,icon_path:path,status:"published"});
  if(error){await db.storage.from("app-icons").remove([path]);showMessage(error.message);return;}
  showMessage("App promotion published!");renderManageApps();
}
async function toggleSponsoredApp(id,status){
  if(!requireAdmin())return;
  const {error}=await db.from("sponsored_apps").update({status:status==="published"?"paused":"published"}).eq("id",id);
  if(error){showMessage(error.message);return;}renderManageApps();
}
async function deleteSponsoredApp(id,path){
  if(!requireAdmin())return;
  const {count,error:countError}=await db.from("tasks").select("id",{count:"exact",head:true}).eq("app_id",id);
  if(countError){showMessage(countError.message);return;}
  if(count>0){showMessage("Delete or reassign this app's tasks first.");return;}
  if(!confirm("Delete this app promotion?"))return;
  const {error}=await db.from("sponsored_apps").delete().eq("id",id);
  if(error){showMessage(error.message);return;}
  if(path)await db.storage.from("app-icons").remove([path]);
  showMessage("App promotion deleted.");renderManageApps();
}
async function renderAdminTasks(){
  if(!requireAdmin())return;
  adminShell(`<div class="card"><h3>Your Tasks</h3><p>Loading tasks...</p></div>`);
  const {data,error}=await db.from("tasks").select("*").order("created_at",{ascending:false});
  if(error){
    adminShell(`<div class="card">Unable to load tasks: ${safe(error.message)}</div>`);
    return;
  }
  let html=`<div class="card"><h3>Your Tasks</h3>
    <button class="btn" onclick="renderCreateTaskPage()">＋ Create Task</button>`;
  if(!data?.length)html+=`<p>No tasks created yet.</p>`;
  for(const t of data||[]){
    html+=`
      <hr><div class="row"><b>${safe(t.title)}</b><span class="pill">${safe(t.status)}</span></div>
      <p class="muted">${safe(t.category||"Task")} · ${money(t.reward_paise)}${t.app_id?" · App-linked":""}</p>
      <button class="btn small light" onclick="editTask('${safe(t.id)}')">Edit</button>
      <button class="btn small light" onclick="toggleTask('${safe(t.id)}','${safe(t.status)}')">${t.status==="published"?"Pause":"Activate"}</button>
      <button class="btn small red" onclick="deleteTask('${safe(t.id)}')">Delete</button>`;
  }
  html+=`</div>`;
  adminShell(html);
}
async function editTask(taskId){
  if(!requireAdmin())return;
  const {data,error}=await db.from("tasks").select("*").eq("id",taskId).single();
  if(error){showMessage(error.message);return;}
  adminShell(`
    <div class="card">
      <h3>Edit Task</h3>
      <label>Title</label><input id="editTitle" value="${safe(data.title)}">
      <label>Description</label><textarea id="editDescription">${safe(data.description||"")}</textarea>
      <label>Category</label><input id="editCategory" value="${safe(data.category||"")}">
      <label>Reward (₹)</label><input id="editReward" type="number" value="${Number(data.reward_paise||0)/100}">
      <label>Task Link</label><input id="editLink" value="${safe(data.task_url||"")}">
      <button class="btn" onclick="updateTask('${safe(taskId)}')">Save Changes</button>
      <button class="btn light" onclick="renderAdminTasks()">Cancel</button>
    </div>
  `);
}
async function updateTask(taskId){
  if(!requireAdmin())return;
  const title=document.getElementById("editTitle").value.trim();
  const description=document.getElementById("editDescription").value.trim();
  const category=document.getElementById("editCategory").value.trim();
  const reward=Number(document.getElementById("editReward").value);
  const taskUrl=document.getElementById("editLink").value.trim();
  if(!title||!description||!Number.isFinite(reward)||reward<=0){
    showMessage("Enter valid task details.");return;
  }
  if(taskUrl&&!/^https?:\/\//i.test(taskUrl)){
    showMessage("Task link must start with http:// or https://");return;
  }
  const {error}=await db.from("tasks").update({
    title,description,category,
    reward_paise:Math.round(reward*100),
    task_url:taskUrl||null
  }).eq("id",taskId);
  if(error){showMessage(error.message);return;}
  showMessage("Task updated.");
  renderAdminTasks();
}
async function toggleTask(taskId,status){
  if(!requireAdmin())return;
  const next=status==="published"?"paused":"published";
  const {error}=await db.from("tasks").update({status:next}).eq("id",taskId);
  if(error){showMessage(error.message);return;}
  renderAdminTasks();
}
async function deleteTask(taskId){
  if(!requireAdmin())return;
  if(!confirm("Delete this task?"))return;
  const {error}=await db.from("tasks").delete().eq("id",taskId);
  if(error){showMessage(error.message);return;}
  showMessage("Task deleted.");
  renderAdminTasks();
}
async function renderApprovalsPage(){
  if(!requireAdmin())return;
  adminShell(`<div class="card"><h3>Task Approvals</h3><p>Loading submissions...</p></div>`);
  const {data,error}=await db.rpc("admin_list_submissions");
  if(error){
    adminShell(`<div class="card">Unable to load submissions: ${safe(error.message)}</div>`);
    return;
  }
  cachedSubmissions=data||[];
  let html=`<div class="card"><h3>Task Approvals</h3>`;
  if(!cachedSubmissions.length)html+=`<p>No submissions found.</p>`;
  for(const s of cachedSubmissions){
    const taskName=s.task_title||s.title||"Task submission";
    html+=`
      <hr><b>${safe(taskName)}</b>
      <p class="muted">User: ${safe(s.username||s.user_id||"Unknown")}</p>
      <p class="status ${safe(s.status)}">${safe(s.status||"pending")}</p>
      ${s.proof_text?`<p>${safe(s.proof_text)}</p>`:""}
      ${s.proof_url?`<p><a href="${safe(s.proof_url)}" target="_blank" rel="noopener">Open proof link</a></p>`:""}
      ${s.proof_path?`<button class="btn small light" onclick="viewProof('${safe(s.proof_path)}')">View Screenshot</button>`:""}
      ${s.status==="pending"?`
        <button class="btn small green" onclick="reviewTask('${safe(s.id)}',true)">Approve</button>
        <button class="btn small red" onclick="reviewTask('${safe(s.id)}',false)">Reject</button>
      `:""}
    `;
  }
  html+=`</div>`;
  adminShell(html);
}
async function viewProof(path){
  if(!requireAdmin())return;
  const {data,error}=await db.storage.from("proofs").createSignedUrl(path,300);
  if(error){showMessage(error.message);return;}
  window.open(data.signedUrl,"_blank");
}
async function reviewTask(submissionId,approved){
  if(!requireAdmin())return;
  const {error}=await db.rpc("review_submission",{
    p_id:submissionId,p_approve:approved
  });
  if(error){showMessage(error.message);return;}
  showMessage(approved?"Submission approved.":"Submission rejected.");
  renderApprovalsPage();
}
async function renderAdminReferrals(){
  if(!requireAdmin())return;
  adminShell(`<div class="card"><h3>Referral Management</h3><p>Loading referrals...</p></div>`);

  const {data,error}=await db.rpc("admin_list_referrals");
  if(error){
    adminShell(`
      <div class="card">
        <h3>Referral Management</h3>
        <p>Unable to load referrals.</p>
        <p class="muted">${safe(error.message)}</p>
        <button class="btn light" onclick="showAdminDashboard()">← Admin Dashboard</button>
      </div>`);
    return;
  }

  const referrals=data||[];
  const count=status=>referrals.filter(r=>r.status===status).length;
  const completed=referrals.filter(r=>r.status==="completed");
  const earned=completed.reduce((sum,r)=>sum+Number(r.reward_paise||0),0);

  let html=`
    <div class="card">
      <div class="row">
        <h3>Referral Management</h3>
        <span class="pill">${referrals.length} total</span>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><span class="muted">Total Referrals</span><b>${referrals.length}</b></div>
        <div class="stat-box"><span class="muted">Pending Review</span><b>${count("pending")}</b></div>
        <div class="stat-box"><span class="muted">Approved</span><b>${count("approved")}</b></div>
        <div class="stat-box"><span class="muted">Completed</span><b>${count("completed")}</b></div>
        <div class="stat-box"><span class="muted">Rejected</span><b>${count("rejected")}</b></div>
        <div class="stat-box"><span class="muted">Rewards Credited</span><b>${money(earned)}</b></div>
      </div>
      <p class="muted">Approve a valid referral. The ₹10 reward is credited only after the referred user also has an approved task.</p>
      <button class="btn light" onclick="showAdminDashboard()">← Admin Dashboard</button>
    </div>`;

  if(!referrals.length){
    html+=`<div class="card center"><p>No referrals found yet.</p></div>`;
  }

  for(const r of referrals){
    const status=String(r.status||"pending");
    const created=r.created_at?new Date(r.created_at).toLocaleString():"—";
    const rewarded=r.rewarded_at?new Date(r.rewarded_at).toLocaleString():"Not credited";
    html+=`
      <div class="card">
        <div class="row">
          <b>${safe(r.referrer_username||"Referrer")}</b>
          <span class="status ${safe(status)}">${safe(status)}</span>
        </div>
        <p class="muted">Invited user: ${safe(r.referred_username||"Unknown")}</p>
        <p class="muted">Referral code: ${safe(r.referral_code||"—")}</p>
        <p class="muted">Created: ${safe(created)}</p>
        <p>Reward: <b>${money(r.reward_paise||1000)}</b></p>
        ${status==="approved"?`<p class="muted">Waiting for the referred user's first approved task. Reward status: ${safe(rewarded)}</p>`:""}
        ${status==="completed"?`<p class="status approved">Reward credited: ${safe(rewarded)}</p>`:""}
        ${status==="pending"?`
          <button class="btn small green" onclick="reviewReferral('${safe(r.referral_id)}',true)">Approve</button>
          <button class="btn small red" onclick="reviewReferral('${safe(r.referral_id)}',false)">Reject</button>
        `:""}
      </div>`;
  }

  adminShell(html);
}

async function reviewReferral(referralId,approved){
  if(!requireAdmin())return;
  const action=approved?"approve this referral":"reject this referral";
  if(!confirm("Are you sure you want to "+action+"?"))return;

  const {error}=await db.rpc("review_referral",{
    p_referral_id:referralId,
    p_approved:approved
  });
  if(error){showMessage(error.message);return;}

  showMessage(approved
    ?"Referral approved. Reward will be credited after the referred user's first approved task."
    :"Referral rejected.");
  renderAdminReferrals();
}

async function renderAdminWithdrawals(){
  if(!requireAdmin())return;
  adminShell(`<div class="card"><h3>Withdrawals</h3><p>Loading...</p></div>`);
  const {data,error}=await db.rpc("admin_list_withdrawals");
  if(error){
    adminShell(`<div class="card">Unable to load withdrawals: ${safe(error.message)}</div>`);
    return;
  }
  cachedWithdrawals=data||[];

    html+=`
      <hr><b>${money(w.amount_paise)}</b>
      <p>User: ${safe(w.full_name||w.user_id||"Unknown")}</p>

      `:""}

async function reviewWithdrawal(id,status){
  if(!requireAdmin())return;
  const action=status==="paid"?"mark this request as paid":"reject this request";
  if(!confirm("Are you sure you want to "+action+"?"))return;
  const {error}=await db.rpc("review_withdrawal",{
    p_withdrawal_id:id,p_status:status
  });
  if(error){showMessage(error.message);return;}
  showMessage("Withdrawal status updated.");
  renderAdminWithdrawals();
}
async function renderManageUsersPage(){
  if(!requireAdmin())return;
  adminShell(`
    <div class="card">
      <h3>Manage Users</h3>
      <input id="userSearch" placeholder="Search username or user ID">
      <button class="btn" onclick="loadAdminUsers()">Search Users</button>
      <div id="usersResult"><p class="muted">Enter a search term or load users.</p></div>
    </div>
  `);
  loadAdminUsers();
}
async function loadAdminUsers(){
  if(!requireAdmin())return;
  const result=document.getElementById("usersResult");
  if(!result)return;
  result.innerHTML="Loading users...";
  const {data,error}=await db.rpc("admin_list_users");
  if(error){result.innerHTML=`<p>${safe(error.message)}</p>`;return;}
  const term=(document.getElementById("userSearch")?.value||"").toLowerCase();
  const users=(data||[]).filter(u=>
    !term||
    String(u.username||"").toLowerCase().includes(term)||
    String(u.user_id||u.id||"").toLowerCase().includes(term)
  );
  if(!users.length){result.innerHTML="<p>No users found.</p>";return;}
  result.innerHTML=users.map(u=>`
    <div class="card">
      <b>${safe(u.username||"User")}</b>
      <p class="muted">${safe(u.user_id||u.id||"")}</p>
      <p>Wallet: ${money(u.balance_paise)}</p>
    </div>
  `).join("");
}

db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
    currentUser=null;
    showLogin();
  }
  if(event==="SIGNED_IN"&&session?.user&&!currentUser){
    currentUser=session.user;
    startApp();
  }
});

initIcons();
startApp();
</script>
