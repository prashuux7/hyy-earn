
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYY EARN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5eaff;color:#321064;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
header{background:#6d28d9;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:21px}
.wrap{max-width:650px;margin:auto;padding:16px;padding-bottom:95px}
.card{background:white;padding:17px;border-radius:18px;margin:12px 0;box-shadow:0 3px 12px #32106412}
.hero{background:linear-gradient(135deg,#6d28d9,#9333ea);color:white}
.big{font-size:30px;font-weight:bold;margin:8px 0}
.muted{color:#806d9b;font-size:13px}
.btn{background:#6d28d9;color:white;padding:12px 16px;border-radius:11px;font-weight:bold}
.btn.light{background:#eee5ff;color:#5b21b6}
.btn.red{background:#dc2626;color:white}
.btn.green{background:#16a34a;color:white}
.btn.small{padding:8px 11px;font-size:13px;margin:3px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ded3ef;border-radius:10px;margin:7px 0 13px;background:#fff;color:#321064}
textarea{min-height:85px;resize:vertical}
label{font-size:13px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#fff;border-radius:15px;padding:16px;text-align:center;font-weight:bold;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:9px 2px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -3px 15px #32106418;z-index:8}
.nav button{background:transparent;color:#806d9b;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.nav button.active{color:#6d28d9;font-weight:bold}
.nav span{font-size:19px}
.hidden{display:none!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;background:#eee5ff;color:#6d28d9;padding:5px 9px;border-radius:20px;font-size:11px}
.status{font-size:12px;font-weight:bold}
.status.pending{color:#b45309}
.status.approved{color:#15803d}
.status.rejected{color:#dc2626}
hr{border:0;border-top:1px solid #eee;margin:14px 0}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modalbox{background:white;border-radius:18px;padding:20px;width:100%;max-width:450px;max-height:90vh;overflow:auto}
.menu{position:absolute;right:15px;top:60px;background:white;color:#321064;padding:12px;border-radius:12px;box-shadow:0 5px 20px #0002;min-width:180px}
.menu button{display:block;width:100%;text-align:left;padding:10px;background:white;color:#321064}
.task{border:1px solid #eee5ff}
.center{text-align:center;padding:35px 10px}
.ref-code{font-size:23px;font-weight:bold;letter-spacing:2px;background:#f5eaff;padding:14px;border-radius:12px;text-align:center;overflow-wrap:anywhere}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-box{background:#f8f4ff;padding:14px;border-radius:12px}
.stat-box b{font-size:22px;display:block;margin-top:5px}
.rule-list{padding-left:20px;line-height:1.7;font-size:14px}
</style>
</head>
<body>

<header>
  <h2>💜 HYY EARN</h2>
  <button onclick="toggleMenu()" style="background:transparent;color:white;font-size:23px">☰</button>
  <div id="profileMenu" class="menu hidden">
    <div id="menuUsername" style="padding:8px;font-weight:bold"></div>
    <button onclick="openPage('profile')">My Profile</button>
    <button onclick="openPage('refer')">Refer & Earn</button>
    <button id="adminMenuBtn" class="hidden" onclick="adminLogin()">Admin Dashboard</button>

</header>

<div class="wrap">
  <section id="app"></section>
</div>

<nav id="bottomNav" class="nav hidden">
  <button data-page="home" onclick="openPage('home')"><span>🏠</span>Home</button>
  <button data-page="task" onclick="openPage('task')"><span>📋</span>Task</button>
  <button data-page="refer" onclick="openPage('refer')"><span>🎁</span>Refer</button>
  <button data-page="community" onclick="openPage('community')"><span>👥</span>Community</button>
  <button data-page="wallet" onclick="openPage('wallet')"><span>💰</span>Wallet</button>
  <button data-page="profile" onclick="openPage('profile')"><span>👤</span>Profile</button>
</nav>

<div id="modalRoot"></div>

<script>
const SUPABASE_URL = "https://hofrfwjldbrfveufuvxu.supabase.co";
const SUPABASE_KEY = "sb_publishable_cdAswmtul4dLtyXvfIrWgQ_i42neFMJ";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    flowType:"pkce",
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});

// Save referral code before Google login / redirect.
const incomingReferral=new URLSearchParams(window.location.search).get("ref");
if(incomingReferral){
  localStorage.setItem("hyy_pending_referral",incomingReferral.trim());
  window.history.replaceState({},document.title,window.location.pathname);
}

let currentUser=null;
let username="";
let walletBalance=0;
let isAdmin=false;
let adminVerified=false;
let currentPage="home";
let cachedTasks=[];
let cachedSubmissions=[];
let cachedWithdrawals=[];
let myReferralCode="";
let referralStats={total_referrals:0,completed:0,pending:0,total_earned_paise:0};

const app=document.getElementById("app");
const modalRoot=document.getElementById("modalRoot");

function money(paise){
  return "₹"+(Number(paise||0)/100).toFixed(2);
}
function safe(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function showMessage(message){alert(message);}
function toggleMenu(){
  document.getElementById("profileMenu").classList.toggle("hidden");
}
function closeMenu(){
  document.getElementById("profileMenu").classList.add("hidden");
}
function setPage(html){app.innerHTML=html;}
function updateNav(){
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===currentPage);
  });
}
async function getWallet(){
  const {data,error}=await db.from("wallet")
    .select("balance_paise")
    .eq("user_id",currentUser.id)
    .maybeSingle();
  if(error) console.error(error);
  walletBalance=data?.balance_paise||0;
}
async function getUsername(){
  const {data,error}=await db.from("profilea")
    .select("username")
    .eq("id",currentUser.id)
    .maybeSingle();
  if(error) console.error(error);
  username=data?.username||"User";
  document.getElementById("menuUsername").textContent=username;
}
async function checkAdmin(){
  const {data,error}=await db.rpc("is_admin");
  isAdmin=!error && (data===true || data?.is_admin===true);
  document.getElementById("adminMenuBtn").classList.toggle("hidden",!isAdmin);
}
async function refreshAccount(){
  await Promise.all([getWallet(),getUsername(),checkAdmin()]);
}

// Link the referral after the invited person has logged in.
async function processPendingReferral(){
  const code=localStorage.getItem("hyy_pending_referral");
  if(!code||!currentUser)return;

  const {data,error}=await db.rpc("register_referral",{p_code:code});
  if(error){
    console.error("Referral registration error:",error);
    return;
  }
  localStorage.removeItem("hyy_pending_referral");
  if(data===true){
    console.log("Referral successfully linked.");
  }else{
    console.log("Referral code invalid, already used, or self-referral.");
  }
}

async function startApp(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){showLogin();return;}
  currentUser=session.user;
  await refreshAccount();
  await processPendingReferral();
  document.getElementById("bottomNav").classList.remove("hidden");
  openPage("home");
}
function showLogin(){
  document.getElementById("bottomNav").classList.add("hidden");
  document.getElementById("profileMenu").classList.add("hidden");
  setPage(`
    <div class="card center">
      <h1>💜 HYY EARN</h1>
      <p>Welcome! Login to continue.</p>
      <button class="btn" onclick="googleLogin()">Continue with Google</button>
      <p class="muted">Demo rewards platform</p>
    </div>
  `);
}
async function googleLogin(){
  const {error}=await db.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:window.location.origin}
  });
  if(error)showMessage(error.message);
}
async function logout(){
  closeMenu();
  await db.auth.signOut();
  currentUser=null;
  showLogin();
}
async function openPage(page){
  if(!currentUser){showLogin();return;}
  currentPage=page;
  updateNav();
  closeMenu();
  document.getElementById("bottomNav").classList.remove("hidden");

  if(page==="home")return renderHome();
  if(page==="task")return renderTasks();
  if(page==="refer")return renderReferPage();
  if(page==="community")return renderCommunity();
  if(page==="wallet")return renderWallet();
  if(page==="profile")return renderProfile();
}

async function renderHome(){
  await getWallet();
  setPage(`
    <div class="card hero">
      <p>Welcome back 👋</p>
      <h2>${safe(username)}</h2>
      <p>Your wallet balance</p>
      <div class="big">${money(walletBalance)}</div>
      <button class="btn light" onclick="openPage('wallet')">View Wallet</button>
    </div>

    <div class="card">
      <div class="row"><h3>Daily Check-in 🎁</h3><span class="pill">Daily</span></div>
      <p class="muted">Check in and see whether today's reward is available.</p>
      <button class="btn" onclick="dailyCheckin()">Daily Check-in</button>
    </div>

    <h3>Earn More</h3>
    <div class="grid">
      <div class="tile" onclick="openPage('task')">📋<br>Tasks</div>
      <div class="tile" onclick="comingSoon()">📝<br>Surveys</div>
      <div class="tile" onclick="comingSoon()">🎮<br>Games</div>
      <div class="tile" onclick="comingSoon()">🎁<br>Rewards</div>
    </div>

    <div class="card">
      <h3>Available Tasks</h3>
      <p class="muted">Explore tasks and submit proof after completing them.</p>
      <button class="btn" onclick="openPage('task')">View Tasks</button>
    </div>

    <div class="card">
      <h3>Refer & Earn 💜</h3>
      <p class="muted">Invite friends. Earn ₹10 when their first task is approved.</p>
      <button class="btn" onclick="openPage('refer')">Invite Friends</button>
    </div>
  `);
}
async function dailyCheckin(){
  const {data,error}=await db.rpc("daily_checkin");
  if(error){showMessage(error.message);return;}
  showMessage(typeof data==="string"?data:"Check-in response received!");
  await getWallet();
  renderHome();
}
function comingSoon(){showMessage("Coming Soon!");}

async function renderTasks(){
  setPage(`<h2>Available Tasks 📋</h2><p class="muted">Loading tasks...</p>`);
  const {data,error}=await db.from("tasks")
    .select("*")
    .eq("status","active")
    .order("created_at",{ascending:false});
  if(error){
    setPage(`<div class="card">Unable to load tasks: ${safe(error.message)}</div>`);
    return;
  }
  cachedTasks=data||[];
  let html=`<h2>Available Tasks 📋</h2>
    <p class="muted">Choose a task to view its details.</p>`;
  if(!cachedTasks.length)html+=`<div class="card center">No active tasks right now.</div>`;
  for(const task of cachedTasks){
    html+=`
      <div class="card task">
        <div class="row"><span class="pill">${safe(task.category||"Task")}</span>
        <b>${money(task.reward_paise)}</b></div>
        <h3>${safe(task.title)}</h3>
        <p class="muted">${safe(task.description||"")}</p>
        <button class="btn" onclick="openTask('${safe(task.id)}')">View Task</button>
      </div>`;
  }
  setPage(html);
}
async function openTask(taskId){
  const task=cachedTasks.find(t=>String(t.id)===String(taskId));
  if(!task)return;
  const {data:submission}=await db.from("task_submissions")
    .select("status")
    .eq("task_id",taskId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  let statusHtml=submission
    ?`<p class="status ${safe(submission.status)}">Your submission: ${safe(submission.status)}</p>`
    :`<button class="btn" onclick="openProof('${safe(task.id)}')">Submit Proof</button>`;

  setPage(`
    <button class="btn light" onclick="renderTasks()">← Back to Tasks</button>
    <div class="card">
      <span class="pill">${safe(task.category||"Task")}</span>
      <h2>${safe(task.title)}</h2>
      <h3>${money(task.reward_paise)} reward</h3>
      <p>${safe(task.description||"No description available.")}</p>
      ${task.task_url?`<p><a href="${safe(task.task_url)}" target="_blank" rel="noopener">Open Task Link ↗</a></p>`:""}
      <hr>${statusHtml}
    </div>
  `);
}
function openProof(taskId){
  modalRoot.innerHTML=`
    <div class="modal"><div class="modalbox">
      <h3>Submit Task Proof</h3>
      <label>Proof description</label>
      <textarea id="proofText" placeholder="Describe what you completed"></textarea>
      <label>Proof link (optional)</label>
      <input id="proofUrl" placeholder="https://...">
      <label>Screenshot (optional, JPG/PNG/WebP, max 5 MB)</label>
      <input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp">
      <button class="btn" onclick="submitProof('${safe(taskId)}')">Submit Proof</button>
      <button class="btn light" onclick="closeModal()">Cancel</button>
    </div></div>`;
}
function closeModal(){modalRoot.innerHTML="";}
async function submitProof(taskId){
  const proofText=document.getElementById("proofText").value.trim();
  const proofUrl=document.getElementById("proofUrl").value.trim();
  const file=document.getElementById("proofFile").files[0];
  if(!proofText&&!proofUrl&&!file){
    showMessage("Please add proof text, a link, or a screenshot.");return;
  }
  if(proofUrl&&!/^https?:\/\//i.test(proofUrl)){
    showMessage("Proof link must start with http:// or https://");return;
  }
  let proofPath=null;
  if(file){
    if(file.size>5*1024*1024){showMessage("File must be under 5 MB.");return;}
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
      showMessage("Only JPG, PNG, or WebP images are allowed.");return;
    }
    const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
    proofPath=`${currentUser.id}/${crypto.randomUUID()}.${ext}`;
    const {error:uploadError}=await db.storage.from("proofs").upload(proofPath,file);
    if(uploadError){showMessage(uploadError.message);return;}
  }
  const {error}=await db.rpc("submit_task",{
    p_task_id:taskId,
    p_proof_text:proofText||null,
    p_proof_url:proofUrl||null,
    p_proof_path:proofPath
  });
  if(error){showMessage(error.message);return;}
  closeModal();
  showMessage("Proof submitted for review!");
  openTask(taskId);
}

// REFER & EARN

  setPage(`<div class="card center"><h2>🎁 Refer & Earn</h2><p>Loading your referral details...</p></div>`);

  const [codeResult,statsResult]=await Promise.all([
    db.rpc("get_my_referral_code"),
    db.rpc("get_referral_stats")
  ]);

  if(codeResult.error){
    setPage(`
      <div class="card">
        <h2>🎁 Refer & Earn</h2>
        <p>Unable to load referral code.</p>
        <p class="muted">${safe(codeResult.error.message)}</p>
        <button class="btn light" onclick="openPage('home')">Back Home</button>
      </div>`);
    return;
  }

  myReferralCode=codeResult.data;
  if(statsResult.error){
    console.error("Referral stats error:",statsResult.error);
    referralStats={total_referrals:0,completed:0,pending:0,total_earned_paise:0};
  }else{
    const row=Array.isArray(statsResult.data)?statsResult.data[0]:statsResult.data;
    referralStats=row||{total_referrals:0,completed:0,pending:0,total_earned_paise:0};
  }

  const referralLink=`${window.location.origin}/?ref=${encodeURIComponent(myReferralCode)}`;

  setPage(`
    <button class="btn light" onclick="openPage('home')">← Back Home</button>

    <div class="card hero center">
      <div style="font-size:42px">🎁</div>
      <h2>Refer Friends & Earn ₹10</h2>
      <p>Invite your friends to HYY EARN.</p>
      <div class="big">₹10</div>
      <p>For every successful referral</p>
    </div>

    <div class="card">
      <h3>Your Referral Code</h3>
      <div class="ref-code" id="refCodeText">${safe(myReferralCode)}</div>
      <button class="btn" style="width:100%;margin-top:12px" onclick="copyReferralCode()">Copy Referral Code</button>
      <hr>
      <label>Your Referral Link</label>
      <input id="referralLinkInput" value="${safe(referralLink)}" readonly>
      <button class="btn light" style="width:100%" onclick="copyReferralLink()">Copy Referral Link</button>
      <button class="btn" style="width:100%;margin-top:8px" onclick="shareReferral()">Share with Friends</button>
    </div>

    <div class="card">
      <h3>Your Referral Statistics</h3>
      <div class="stat-grid">
        <div class="stat-box"><span class="muted">Total Referrals</span><b>${Number(referralStats.total_referrals||0)}</b></div>
        <div class="stat-box"><span class="muted">Completed</span><b>${Number(referralStats.completed||0)}</b></div>
        <div class="stat-box"><span class="muted">Pending</span><b>${Number(referralStats.pending||0)}</b></div>
        <div class="stat-box"><span class="muted">Total Earned</span><b>${money(referralStats.total_earned_paise)}</b></div>
      </div>
    </div>

    <div class="card">
      <h3>How It Works</h3>
      <ol class="rule-list">
        <li>Share your referral code or referral link with a friend.</li>
        <li>Your friend opens the link and signs up for HYY EARN.</li>
        <li>Your friend completes their first available task.</li>
        <li>Admin reviews and approves that task submission.</li>
        <li>You receive ₹10 in your wallet after approval.</li>
      </ol>
    </div>

    <div class="card">
      <h3>Referral Rules</h3>
      <ol class="rule-list">
        <li>Earn ₹10 for every successful referral.</li>
        <li>Reward is credited only after the friend's first task is approved.</li>
        <li>Each friend can be referred only once.</li>
        <li>Self-referrals are not allowed.</li>
        <li>Fake or duplicate accounts are not eligible.</li>
        <li>Referral rewards are credited after approval.</li>
      </ol>
    </div>
  `);
}

async function copyReferralCode(){
  if(!myReferralCode)return;
  try{
    await navigator.clipboard.writeText(myReferralCode);
    showMessage("Referral code copied!");
  }catch(e){
    prompt("Copy your referral code:",myReferralCode);
  }
}
async function copyReferralLink(){
  const input=document.getElementById("referralLinkInput");
  if(!input)return;
  try{
    await navigator.clipboard.writeText(input.value);
    showMessage("Referral link copied!");
  }catch(e){
    input.focus();
    input.select();
    showMessage("Select and copy the referral link.");
  }
}
async function shareReferral(){
  if(!myReferralCode)return;
  const link=`${window.location.origin}/?ref=${encodeURIComponent(myReferralCode)}`;
  const message=`Join me on HYY EARN! Sign up using my referral link: ${link}`;
  if(navigator.share){
    try{
      await navigator.share({title:"Join HYY EARN",text:message,url:link});
    }catch(e){
      if(e.name!=="AbortError")showMessage("Unable to open sharing options.");
    }
  }else{
    try{
      await navigator.clipboard.writeText(message);
      showMessage("Invite message copied! Share it with your friends.");
    }catch(e){
      prompt("Copy and share this invite:",message);
    }
  }
}

function renderCommunity(){
  setPage(`
    <div class="card center">
      <div style="font-size:45px">👥</div>
      <h2>Community</h2>
      <p class="muted">Community features are coming soon.</p>
    </div>
  `);
}
async function renderWallet(){
  await getWallet();
  setPage(`
    <div class="card hero">
      <p>My Wallet 💰</p>
      <div class="big">${money(walletBalance)}</div>
      <p>Available balance</p>
    </div>
    <div class="card">
      <h3>Withdraw Request</h3>
      <p class="muted">Minimum request amount ₹100. Requests are reviewed manually.</p>
      <button class="btn" onclick="openWithdraw()">Request Withdrawal</button>
    </div>
    <div class="card">
      <h3>Withdrawal History</h3>
      <button class="btn light" onclick="renderWithdrawalHistory()">View History</button>
    </div>
  `);
}
function openWithdraw(){
  modalRoot.innerHTML=`
    <div class="modal"><div class="modalbox">
      <h3>Withdrawal Request</h3>
      <label>Full Name</label>
      <input id="withdrawName" placeholder="Enter full name">
      <label>UPI ID</label>
      <input id="withdrawUpi" placeholder="example@upi">
      <label>Amount (₹)</label>
      <input id="withdrawAmount" type="number" min="100" placeholder="Minimum ₹100">
      <button class="btn" onclick="sendWithdrawal()">Submit Request</button>
      <button class="btn light" onclick="closeModal()">Cancel</button>
    </div></div>`;
}
async function sendWithdrawal(){
  const fullName=document.getElementById("withdrawName").value.trim();
  const upi=document.getElementById("withdrawUpi").value.trim();
  const amount=Number(document.getElementById("withdrawAmount").value);
  if(!fullName||!upi||!Number.isFinite(amount)||amount<100){
    showMessage("Enter valid details. Minimum amount is ₹100.");return;
  }
  if(!/^[\w.-]+@[\w.-]+$/.test(upi)){
    showMessage("Please enter a valid UPI ID.");return;
  }
  const {error}=await db.rpc("request_withdrawal",{
    p_amount:Math.round(amount*100),
    p_full_name:fullName,
    p_upi:upi
  });
  if(error){showMessage(error.message);return;}
  closeModal();
  showMessage("Withdrawal request submitted. It is not an automatic transfer.");
  await renderWallet();
}
async function renderWithdrawalHistory(){
  setPage(`<h2>Withdrawal History</h2><p>Loading...</p>`);
  const {data,error}=await db.from("withdrawals")
    .select("id,amount_paise,status,created_at")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});
  if(error){setPage(`<div class="card">${safe(error.message)}</div>`);return;}
  let html=`<button class="btn light" onclick="openPage('wallet')">← Wallet</button><h2>Withdrawal History</h2>`;
  if(!data?.length)html+=`<div class="card">No withdrawal requests yet.</div>`;
  for(const w of data||[]){
    html+=`<div class="card">
      <div class="row"><b>${money(w.amount_paise)}</b>
      <span class="status ${safe(w.status)}">${safe(w.status)}</span></div>
      <p class="muted">${new Date(w.created_at).toLocaleString()}</p>
    </div>`;
  }
  setPage(html);
}
function renderProfile(){
  setPage(`
    <div class="card center">
      <div style="font-size:45px">👤</div>
      <h2>${safe(username)}</h2>
      <p class="muted">${safe(currentUser.email||"")}</p>
    </div>
    <div class="card">
      <button class="btn light" onclick="openPage('wallet')">My Wallet</button>
      <button class="btn light" onclick="openPage('refer')">🎁 Refer & Earn</button>
      ${isAdmin?`<button class="btn" onclick="adminLogin()">Admin Dashboard</button>`:""}
      <button class="btn red" onclick="logout()">Logout</button>
    </div>
  `);
}

async function adminLogin(){
  closeMenu();
  if(!isAdmin){showMessage("Admin access only.");return;}
  const password=prompt("Enter Admin Password");
  if(password===null)return;
  const {data,error}=await db.functions.invoke("smart-function",{body:{password}});
  if(error){showMessage(error.message);return;}
  if(!data||data.success!==true){
    showMessage(data?.message||"Admin verification failed.");return;
  }
  adminVerified=true;
  showAdminDashboard();
}
function requireAdmin(){
  if(!isAdmin||!adminVerified){
    showMessage("Please verify admin access first.");return false;
  }
  return true;
}
function adminShell(content){
  document.getElementById("bottomNav").classList.add("hidden");
  currentPage="admin";
  setPage(`
    <div class="card hero">
      <h2>HYY EARN Administration</h2>
      <p>Admin Dashboard</p>
      <b>Welcome, ${safe(username)}</b>
    </div>
    <button class="btn light" onclick="adminBack()">← User Dashboard</button>
    ${content}
  `);
}
function adminBack(){
  adminVerified=false;
  openPage("home");
}
function showAdminDashboard(){
  if(!requireAdmin())return;
  adminShell(`
    <div class="card">
      <h3>Admin Dashboard</h3>
      <p class="muted">Manage your platform from here.</p>
      <button class="btn" onclick="renderCreateTaskPage()">＋ Create Tasks</button>
      <button class="btn light" onclick="renderAdminTasks()">Your Tasks</button>
      <button class="btn light" onclick="renderApprovalsPage()">Task Approvals</button>
      <button class="btn light" onclick="renderAdminWithdrawals()">Withdrawals</button>
      <button class="btn light" onclick="renderManageUsersPage()">Manage Users</button>
      <button class="btn light" onclick="showMessage('Notifications coming soon!')">Notifications</button>
    </div>
  `);
}
function renderCreateTaskPage(){
  if(!requireAdmin())return;
  adminShell(`
    <div class="card">
      <h3>Create New Task</h3>
      <label>Task Title</label>
      <input id="newTaskTitle" placeholder="Enter task title">
      <label>Task Description</label>
      <textarea id="newTaskDescription" placeholder="Explain the task"></textarea>
      <label>Category</label>
      <select id="newTaskCategory">
        <option>Survey</option><option>Social Media</option>
        <option>Website</option><option>Other</option>
      </select>
      <label>Reward Amount (₹)</label>
      <input id="newTaskReward" type="number" min="1" placeholder="Enter reward">
      <label>Task Link (optional)</label>
      <input id="newTaskLink" type="url" placeholder="https://...">
      <button class="btn" onclick="saveNewTask('active')">Publish Task</button>
      <button class="btn light" onclick="saveNewTask('draft')">Save as Draft</button>
      <button class="btn light" onclick="showAdminDashboard()">Cancel</button>
    </div>
  `);
}
async function saveNewTask(status){
  if(!requireAdmin())return;
  const title=document.getElementById("newTaskTitle").value.trim();
  const description=document.getElementById("newTaskDescription").value.trim();
  const category=document.getElementById("newTaskCategory").value;
  const reward=Number(document.getElementById("newTaskReward").value);
  const taskUrl=document.getElementById("newTaskLink").value.trim();
  if(!title||!description||!Number.isFinite(reward)||reward<=0){
    showMessage("Please fill title, description and a valid reward.");return;
  }
  if(taskUrl&&!/^https?:\/\//i.test(taskUrl)){
    showMessage("Task link must start with http:// or https://");return;
  }
  const {error}=await db.from("tasks").insert({
    title,description,category,
    reward_paise:Math.round(reward*100),
    task_url:taskUrl||null,status
  });
  if(error){showMessage(error.message);return;}
  showMessage(status==="active"?"Task published!":"Task saved as draft!");
  renderAdminTasks();
}
async function renderAdminTasks(){
  if(!requireAdmin())return;
  adminShell(`<div class="card"><h3>Your Tasks</h3><p>Loading tasks...</p></div>`);
  const {data,error}=await db.from("tasks").select("*").order("created_at",{ascending:false});
  if(error){
    adminShell(`<div class="card">Unable to load tasks: ${safe(error.message)}</div>`);
    return;
  }
  let html=`<div class="card"><h3>Your Tasks</h3>
    <button class="btn" onclick="renderCreateTaskPage()">＋ Create Task</button>`;
  if(!data?.length)html+=`<p>No tasks created yet.</p>`;
  for(const t of data||[]){
    html+=`
      <hr><div class="row"><b>${safe(t.title)}</b><span class="pill">${safe(t.status)}</span></div>
      <p class="muted">${safe(t.category||"Task")} · ${money(t.reward_paise)}</p>
      <button class="btn small light" onclick="editTask('${safe(t.id)}')">Edit</button>
      <button class="btn small light" onclick="toggleTask('${safe(t.id)}','${safe(t.status)}')">${t.status==="active"?"Pause":"Activate"}</button>
      <button class="btn small red" onclick="deleteTask('${safe(t.id)}')">Delete</button>`;
  }
  html+=`</div>`;
  adminShell(html);
}
async function editTask(taskId){
  if(!requireAdmin())return;
  const {data,error}=await db.from("tasks").select("*").eq("id",taskId).single();
  if(error){showMessage(error.message);return;}
  adminShell(`
    <div class="card">
      <h3>Edit Task</h3>
      <label>Title</label><input id="editTitle" value="${safe(data.title)}">
      <label>Description</label><textarea id="editDescription">${safe(data.description||"")}</textarea>
      <label>Category</label><input id="editCategory" value="${safe(data.category||"")}">
      <label>Reward (₹)</label><input id="editReward" type="number" value="${Number(data.reward_paise||0)/100}">
      <label>Task Link</label><input id="editLink" value="${safe(data.task_url||"")}">
      <button class="btn" onclick="updateTask('${safe(taskId)}')">Save Changes</button>
      <button class="btn light" onclick="renderAdminTasks()">Cancel</button>
    </div>
  `);
}
async function updateTask(taskId){
  if(!requireAdmin())return;
  const title=document.getElementById("editTitle").value.trim();
  const description=document.getElementById("editDescription").value.trim();
  const category=document.getElementById("editCategory").value.trim();
  const reward=Number(document.getElementById("editReward").value);
  const taskUrl=document.getElementById("editLink").value.trim();
  if(!title||!description||!Number.isFinite(reward)||reward<=0){
    showMessage("Enter valid task details.");return;
  }
  if(taskUrl&&!/^https?:\/\//i.test(taskUrl)){
    showMessage("Task link must start with http:// or https://");return;
  }
  const {error}=await db.from("tasks").update({
    title,description,category,
    reward_paise:Math.round(reward*100),
    task_url:taskUrl||null
  }).eq("id",taskId);
  if(error){showMessage(error.message);return;}
  showMessage("Task updated.");
  renderAdminTasks();
}
async function toggleTask(taskId,status){
  if(!requireAdmin())return;
  const next=status==="active"?"paused":"active";
  const {error}=await db.from("tasks").update({status:next}).eq("id",taskId);
  if(error){showMessage(error.message);return;}
  renderAdminTasks();
}
async function deleteTask(taskId){
  if(!requireAdmin())return;
  if(!confirm("Delete this task?"))return;
  const {error}=await db.from("tasks").delete().eq("id",taskId);
  if(error){showMessage(error.message);return;}
  showMessage("Task deleted.");
  renderAdminTasks();
}
async function renderApprovalsPage(){
  if(!requireAdmin())return;
  adminShell(`<div class="card"><h3>Task Approvals</h3><p>Loading submissions...</p></div>`);
  const {data,error}=await db.rpc("admin_list_submissions");
  if(error){
    adminShell(`<div class="card">Unable to load submissions: ${safe(error.message)}</div>`);
    return;
  }
  cachedSubmissions=data||[];
  let html=`<div class="card"><h3>Task Approvals</h3>`;
  if(!cachedSubmissions.length)html+=`<p>No submissions found.</p>`;
  for(const s of cachedSubmissions){
    const taskName=s.task_title||s.title||"Task submission";
    html+=`
      <hr><b>${safe(taskName)}</b>
      <p class="muted">User: ${safe(s.username||s.user_id||"Unknown")}</p>
      <p class="status ${safe(s.status)}">${safe(s.status||"pending")}</p>
      ${s.proof_text?`<p>${safe(s.proof_text)}</p>`:""}
      ${s.proof_url?`<p><a href="${safe(s.proof_url)}" target="_blank" rel="noopener">Open proof link</a></p>`:""}
      ${s.proof_path?`<button class="btn small light" onclick="viewProof('${safe(s.proof_path)}')">View Screenshot</button>`:""}
      ${s.status==="pending"?`
        <button class="btn small green" onclick="reviewTask('${safe(s.id)}',true)">Approve</button>
        <button class="btn small red" onclick="reviewTask('${safe(s.id)}',false)">Reject</button>
      `:""}
    `;
  }
  html+=`</div>`;
  adminShell(html);
}
async function viewProof(path){
  if(!requireAdmin())return;
  const {data,error}=await db.storage.from("proofs").createSignedUrl(path,300);
  if(error){showMessage(error.message);return;}
  window.open(data.signedUrl,"_blank");
}
async function reviewTask(submissionId,approved){
  if(!requireAdmin())return;
  const {error}=await db.rpc("review_submission",{
    p_submission_id:submissionId,p_approved:approved
  });
  if(error){showMessage(error.message);return;}
  showMessage(approved?"Submission approved.":"Submission rejected.");
  renderApprovalsPage();
}
async function renderAdminWithdrawals(){
  if(!requireAdmin())return;
  adminShell(`<div class="card"><h3>Withdrawals</h3><p>Loading...</p></div>`);
  const {data,error}=await db.rpc("admin_list_withdrawals");
  if(error){
    adminShell(`<div class="card">Unable to load withdrawals: ${safe(error.message)}</div>`);
    return;
  }
  cachedWithdrawals=data||[];
  let html=`<div class="card"><h3>Withdrawal Requests</h3>`;
  if(!cachedWithdrawals.length)html+=`<p>No withdrawal requests.</p>`;
  for(const w of cachedWithdrawals){
    html+=`
      <hr><b>${money(w.amount_paise)}</b>
      <p>User: ${safe(w.full_name||w.user_id||"Unknown")}</p>
      <p>UPI: ${safe(w.upi_id||"Not provided")}</p>
      <p class="status ${safe(w.status)}">${safe(w.status)}</p>
      ${w.status==="pending"?`
        <button class="btn small green" onclick="reviewWithdrawal('${safe(w.id)}','paid')">Mark Paid</button>
        <button class="btn small red" onclick="reviewWithdrawal('${safe(w.id)}','rejected')">Reject</button>
      `:""}
    `;
  }
  html+=`</div>`;
  adminShell(html);
}
async function reviewWithdrawal(id,status){
  if(!requireAdmin())return;
  const action=status==="paid"?"mark this request as paid":"reject this request";
  if(!confirm("Are you sure you want to "+action+"?"))return;
  const {error}=await db.rpc("review_withdrawal",{
    p_withdrawal_id:id,p_status:status
  });
  if(error){showMessage(error.message);return;}
  showMessage("Withdrawal status updated.");
  renderAdminWithdrawals();
}
async function renderManageUsersPage(){
  if(!requireAdmin())return;
  adminShell(`
    <div class="card">
      <h3>Manage Users</h3>
      <input id="userSearch" placeholder="Search username or user ID">
      <button class="btn" onclick="loadAdminUsers()">Search Users</button>
      <div id="usersResult"><p class="muted">Enter a search term or load users.</p></div>
    </div>
  `);
  loadAdminUsers();
}
async function loadAdminUsers(){
  if(!requireAdmin())return;
  const result=document.getElementById("usersResult");
  if(!result)return;
  result.innerHTML="Loading users...";
  const {data,error}=await db.rpc("admin_list_users");
  if(error){result.innerHTML=`<p>${safe(error.message)}</p>`;return;}
  const term=(document.getElementById("userSearch")?.value||"").toLowerCase();
  const users=(data||[]).filter(u=>
    !term||
    String(u.username||"").toLowerCase().includes(term)||
    String(u.user_id||u.id||"").toLowerCase().includes(term)
  );
  if(!users.length){result.innerHTML="<p>No users found.</p>";return;}
  result.innerHTML=users.map(u=>`
    <div class="card">
      <b>${safe(u.username||"User")}</b>
      <p class="muted">${safe(u.user_id||u.id||"")}</p>
      <p>Wallet: ${money(u.balance_paise)}</p>
    </div>
  `).join("");
}

db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
    currentUser=null;
    showLogin();
  }
  if(event==="SIGNED_IN"&&session?.user&&!currentUser){
    currentUser=session.user;
    startApp();
  }
});

startApp();
</script>
</body>
</html>
