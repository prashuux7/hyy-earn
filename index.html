<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYY EARN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7f3;font-family:Arial,sans-serif;padding:30px 15px;text-align:center}
.card{max-width:450px;margin:50px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{font-size:34px;margin-bottom:25px}
h1 span{color:#d5a500}
input,button{width:100%;padding:15px;margin:10px 0;border-radius:10px;font-size:16px}
input{border:1px solid #ddd}
button{background:#171717;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5}
#status{color:#c0392b;font-size:14px;overflow-wrap:anywhere}
.muted{color:#777;font-size:14px}
</style>
</head>

<body>

<div class="card">
 <h1>HYY <span>EARN</span></h1>
 <div id="content">Loading...</div>
 <p id="status"></p>
 <p id="dbg" class="muted" style="overflow-wrap:anywhere"></p>
</div>

<script>
const SUPABASE_URL = "https://hofrfwjldbrfveufuvxu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cdAswmtul4dLtyXvfIrWgQ_i42neFMJ";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
 auth:{
  flowType:"pkce",
  persistSession:true,
  autoRefreshToken:true,
  detectSessionInUrl:false
 }
});

const content = document.getElementById("content");
const status = document.getElementById("status");
const dbg = document.getElementById("dbg");

function showStatus(message){
 status.textContent = message || "";
}

dbg.textContent =
 "key: " + (SUPABASE_ANON_KEY ? "set" : "EMPTY") +
 " | hash token: " + location.hash.includes("access_token") +
 " | code: " + location.search.includes("code=");

const urlParams = new URLSearchParams(
 location.hash.slice(1) + "&" + location.search.slice(1)
);
if(urlParams.get("error_description")){
 showStatus(urlParams.get("error_description"));
}

function showLogin(){
 content.innerHTML = `
  <h3>Welcome to HYY EARN</h3>
  <p class="muted">Login with your Google account</p>
  <button id="login">Continue with Google</button>
 `;

 document.getElementById("login").onclick = async()=>{
  showStatus("Connecting...");
  const {error} = await client.auth.signInWithOAuth({
   provider:"google",
   options:{ redirectTo:window.location.origin }
  });
  if(error) showStatus(error.message);
 };
}

function showUsername(user){
 content.innerHTML = `
  <h3>Create your username</h3>
  <p class="muted">Choose a unique username</p>
  <input id="username" maxlength="20" placeholder="Enter username">
  <button id="save">Save Username</button>
 `;

 document.getElementById("save").onclick = async()=>{
  const username = document.getElementById("username").value.trim();

  if(!/^[a-zA-Z0-9_-]{3,20}$/.test(username)){
   showStatus("Use 3-20 letters, numbers, _ or -");
   return;
  }

  const saveButton = document.getElementById("save");
  saveButton.disabled = true;
  showStatus("Saving...");

  const {error} = await client
   .from("profilea")
   .insert({ id:user.id, username:username });

  if(error){
   saveButton.disabled = false;
   showStatus(
    error.code === "23505" ? "Username already taken" : error.message
   );
   return;
  }

  showStatus("");
  showDashboard(username);
 };
}

function showDashboard(username){
 content.innerHTML = `
  <h2 id="welcome"></h2>
  <p>Account created successfully.</p>
  <p class="muted">HYY EARN Demo Platform</p>
  <button id="logout">Logout</button>
 `;

 document.getElementById("welcome").textContent = "Welcome, " + username + "!";

 document.getElementById("logout").onclick = async()=>{
  showStatus("Logging out...");
  const {error} = await client.auth.signOut();
  if(error){
   showStatus(error.message);
   return;
  }
  showLogin();
  showStatus("");
 };
}

async function loadUser(user){
 showStatus("Loading profile...");

 const {data:profile,error} = await client
  .from("profilea")
  .select("username")
  .eq("id",user.id)
  .maybeSingle();

 if(error){
  showStatus(error.message);
  return;
 }

 showStatus("");

 if(profile){
  showDashboard(profile.username);
 }else{
  showUsername(user);
 }
}

async function checkLogin(){
 const {data,error} = await client.auth.getSession();

 if(error){
  showStatus(error.message);
  showLogin();
  return;
 }

 const user = data.session?.user;

 if(!user){
  showLogin();
  return;
 }

 await loadUser(user);
}

client.auth.onAuthStateChange((event,session)=>{
 dbg.textContent += " | " + event + ":" + (session ? "yes" : "no");

 if(event === "INITIAL_SESSION") return;

 if(session?.user && event === "SIGNED_IN"){
  setTimeout(()=>{ loadUser(session.user); },0);
 }else if(event === "SIGNED_OUT"){
  showLogin();
 }
});

async function start(){
 const code = new URLSearchParams(location.search).get("code");
 if(code){
  showStatus("Finishing login...");
  const {error} = await client.auth.exchangeCodeForSession(code);
  history.replaceState({}, "", location.pathname);
  if(error) showStatus("Exchange error: " + error.message);
 }
 checkLogin();
}

start();
</script>

</body>
</html>
